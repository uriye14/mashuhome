/* ── HERO: horizontal split ── */
.hero-wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.hero{display:flex;gap:48px;align-items:stretch;min-height:0;padding:48px 0 40px}

.hero-text .desc{font-size:16px;color:#5a7a5a;line-height:1.7;margin-bottom:24px;max-width:500px}

/* ── meta pills ── */
.meta-pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:0}
.pill{display:flex;align-items:center;gap:5px;font-size:13px;color:#4a6a4a;background:#e8ede8;padding:6px 15px;border-radius:24px;font-weight:500;transition:all .2s}
.pill:hover{background:#d5e0d5}
.pill.highlight{background:#1a3a1a;color:#e5f0e5}

/* ── Right: image ── */
.hero-image{flex-shrink:0;width:360px;position:relative;display:flex;align-items:center}

/* ── Body ── */
.body{max-width:1200px;margin:0 auto;padding:0 32px 80px;display:grid;grid-template-columns:1fr 1fr;gap:48px}

/* ── Section ── */
.section-title{font-size:16px;font-weight:700;color:#1a3a1a;margin-bottom:18px;padding-left:14px;border-left:3px solid #4a9a4a;letter-spacing:.3px}

.ingredients{list-style:none;display:flex;flex-direction:column;gap:8px}

.ingredient-check{width:20px;height:20px;border-radius:50%;border:2px solid #4a9a4a;background:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;font-size:0;color:transparent;position:relative}

.ingredient-check.done{background:#4a9a4a;border-color:#4a9a4a}

.steps{display:flex;flex-direction:column;gap:18px}
.step{display:flex;gap:0;transition:all .2s;align-items:flex-start}
.step:hover{transform:translateX(4px)}
/* ── Step left column: check-btn + step-num stacked ── */
.step-left{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:12px;width:40px;flex-shrink:0;cursor:pointer}
.step-left .check-btn{width:24px;height:24px;border-radius:50%;border:2px solid #4a9a4a;background:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .3s;position:relative;font-size:0}
.step-left .check-btn::after{content:'✓';font-size:14px;font-weight:700;color:white;opacity:0;transition:opacity .3s}
.step-left .step-num{width:28px;height:28px;background:#4a9a4a;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:all .3s}
.step:hover .step-left .step-num{background:#2a7a2a;transform:scale(1.1)}
.step-body{flex:1;background:white;padding:15px 20px;border-radius:14px;box-shadow:0 1px 4px rgba(26,58,26,.03);transition:all .2s}
.step:hover .step-body{box-shadow:0 6px 20px rgba(26,58,26,.08)}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.step-head strong{font-size:15px}
.step-body p{font-size:14px;line-height:1.65;color:#4a5a4a}
.step-check{display:none}
.step-check:checked + label .step .step-left .check-btn{background:#4a9a4a;border-color:#4a9a4a}
.step-check:checked + label .step .step-left .check-btn::after{opacity:1}
.step-check:checked + label .step .step-left .step-num{background:#9ac99a}
.step-check:checked + label .step .step-body{opacity:.5;text-decoration:line-through;text-decoration-color:#4a9a4a;text-decoration-thickness:1.5px}
.step label{cursor:pointer;display:flex;width:100%}

/* ── Step click fix for mobile ── */
.step-left{cursor:pointer}

.tip{grid-column:1/-1;background:#eaf3ea;border:1px solid #c5dcc5;border-radius:16px;padding:20px 24px;font-size:14px;color:#3a5a3a;line-height:1.7}

.shop-card .name{font-size:14px;font-weight:700;color:#1a3a1a;margin-bottom:4px}

}

@media(max-width:768px){

  .hero-text .desc{font-size:14px}

  .pill{font-size:11px;padding:4px 11px}

  .tip{grid-column:1}
  .hero-wrap,.body{padding-left:16px;padding-right:16px}
  .top-bar{padding:10px 16px}
  .divider{padding:0 16px}
}
