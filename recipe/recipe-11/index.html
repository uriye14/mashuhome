.footer-shop-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex:1;transition:all .2s;cursor:pointer}

.footer-shop-card .sub{font-size:10px;color:rgba(255,255,255,.35)}
.footer-shop-card .qr-mini{width:36px;height:36px;border-radius:6px;object-fit:cover;cursor:pointer;flex-shrink:0}
.footer-btm{text-align:center;font-size:12px;color:rgba(255,255,255,.35);padding-top:16px;margin-top:24px;border-top:1px solid rgba(255,255,255,.06)}

.qr-modal.open{display:flex}
.qr-modal-box{background:white;border-radius:16px;padding:20px;max-width:300px;width:90%;text-align:center;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.qr-modal-box img{width:100%;border-radius:8px;margin-bottom:10px}
.qr-modal-box p{font-size:12px;color:#5a7a5a;margin-bottom:10px}
.qr-modal-box button{background:#142114;color:#edf5ed;border:none;border-radius:50px;padding:6px 24px;font-size:12px;cursor:pointer;font-family:inherit}

<!-- QR Modal -->
<div class="qr-modal" id="qrModalR" onclick="this.classList.remove('open')">

  </div>
</div>

<script>
const qrDataR = {
  weixin: { src: 'https://i.postimg.cc/85nRsDpT/wei-xin-dian-pu-chu-chuang.png', text: '扫码进店购买小美主机和配件' },
  zengli: { src: 'https://i.postimg.cc/VNkrQnzK/ceng-li-wei-xin-er-wei-ma.png', text: '扫码联系曾丽顾问咨询美善品' }
}
function openQR(key) {
  const d = qrDataR[key]
  document.getElementById('qrModalImgR').src = d.src
  document.getElementById('qrModalTextR').textContent = d.text
  document.getElementById('qrModalR').classList.add('open')
}
</script>
