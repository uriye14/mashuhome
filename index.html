                  <div style={{ flexShrink: 0, width: 32, height: 32, borderRadius: '50%', background: i === 0 ? '#4a9a55' : '#e8f0e4', color: i === 0 ? 'white' : '#5a7a50', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 14 }}>{i + 1}</div>
                  <div style={{ background: 'white', borderRadius: 12, border: '1px solid #ede8e0', padding: '1rem 1.2rem', flex: 1 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                      <span style={{ fontWeight: 600, color: '#2a2018', fontSize: 14 }}>{step.title}</span>
                      {step.time && <span style={{ fontSize: 11, background: '#f0f8ec', color: '#4a8a3a', padding: '2px 10px', borderRadius: 20 }}>{step.time}</span>}
                    </div>
                    <p style={{ fontSize: 13, color: '#7a6e60', lineHeight: 1.75, margin: 0 }}>{step.desc}</p>
                  </div>
                </div>
              ))}
            </section>

            <div style={{ marginTop: 24, background: '#f5fbf0', border: '1px solid #d4eac8', borderRadius: 10, padding: '1rem 1.2rem' }}>
              <p style={{ fontSize: 13, color: '#4a7a3a', margin: 0, lineHeight: 1.7 }}>
                💡 <strong>小贴士：</strong>所有步骤均适用于小美（Thermomix Friend）。TM5 / TM6 / TM7 用户可根据各自机型说明书微调温度和时间设定。
              </p>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [search, setSearch] = useState('');
      const [category, setCategory] = useState('全部');
      const [selected, setSelected] = useState(null);

      const filtered = useMemo(() => recipes.filter(r => {
        const matchCat = category === '全部' || r.category === category;
        const matchSearch = !search || r.title.includes(search) || r.desc.includes(search);
        return matchCat && matchSearch;
      }), [search, category]);

      if (selected) return <RecipeDetail r={selected} onBack={() => setSelected(null)} />;

      return (
        <div>
          <header style={{ background: 'white', borderBottom: '1px solid #eee8de' }}>
            <div style={{ maxWidth: 1060, margin: '0 auto', padding: '1.2rem 2rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <img src="https://i.postimg.cc/BQ6sKJm4/ma-shu-cai-pulogo.png" alt="麻薯菜谱"
                  style={{ width: 80, height: 80, borderRadius: '50%', objectFit: 'cover', objectPosition: 'center 20%', flexShrink: 0 }} />
                <div>
                  <h1 style={{ fontSize: 22, fontWeight: 700, color: '#1a1810', letterSpacing: '-0.5px', lineHeight: 1.1 }}>麻薯菜谱</h1>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 4 }}>
                    <span style={{ width: 14, height: 1, background: '#c8b89a', display: 'inline-block' }} />
                    <span style={{ fontSize: 10, color: '#8a7a5a', letterSpacing: 2, textTransform: 'uppercase' }}>mashuhome</span>
                    <span style={{ width: 14, height: 1, background: '#c8b89a', display: 'inline-block' }} />
                  </div>
                </div>
              </div>
              <div style={{ position: 'relative' }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b0a090" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none' }}>
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" placeholder="搜索食谱…" value={search} onChange={e => setSearch(e.target.value)}
                  style={{ padding: '9px 14px 9px 34px', borderRadius: 24, border: '1px solid #e0d8cc', fontSize: 13, background: '#fdf9f4', color: '#2a2018', outline: 'none', width: 200, fontFamily: 'inherit' }} />
              </div>
            </div>

            <div style={{ position: 'relative', borderTop: '1px solid #ede8e0', overflow: 'hidden', height: 220 }}>
              <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200&h=400&fit=crop" alt="家庭餐桌"
                style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} />
              <div style={{ position: 'absolute', inset: 0, background: 'rgba(20,15,8,0.48)' }} />
              <div style={{ position: 'relative', zIndex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', padding: '0 2rem', textAlign: 'center' }}>
                <h2 style={{ fontSize: 28, fontWeight: 700, color: 'white', marginBottom: 10, textShadow: '0 1px 6px rgba(0,0,0,0.4)' }}>家常美味，轻松上桌</h2>
                <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.82)' }}>所有食谱适配小美，并标注 TM5 · TM6 · TM7 兼容性</p>
              </div>
            </div>

            <div style={{ maxWidth: 1060, margin: '0 auto', padding: '1rem 2rem', display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {categories.map(c => (
                <button key={c} onClick={() => setCategory(c)}
                  style={{ padding: '6px 16px', borderRadius: 24, fontSize: 13, fontWeight: 500, transition: 'all 0.15s', background: category === c ? '#4a9a55' : 'transparent', color: category === c ? 'white' : '#6a5a48', border: category === c ? 'none' : '1px solid #ddd4c4' }}>
                  {c}
                </button>
              ))}
            </div>
          </header>

          <main style={{ maxWidth: 1060, margin: '0 auto', padding: '1.5rem 2rem 5rem' }}>
            <p style={{ fontSize: 12, color: '#b0a090', marginBottom: 20 }}>{filtered.length} 道食谱</p>
            {filtered.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '5rem 0', color: '#b0a090' }}>
                <p style={{ fontSize: 15 }}>暂无相关食谱，换个关键词试试吧～</p>
              </div>
            ) : (
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(290px, 1fr))', gap: 22 }}>
                {filtered.map(r => (
                  <article key={r.id} className="card" onClick={() => setSelected(r)}
                    style={{ background: 'white', borderRadius: 14, border: '1px solid #ede8e0', overflow: 'hidden' }}>
                    <div style={{ height: 190, overflow: 'hidden' }}>
                      <img src={r.img} alt={r.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                    </div>
                    <div style={{ padding: '1rem 1.1rem 1.2rem' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 6 }}>
                        <h3 style={{ fontSize: 16, fontWeight: 700, color: '#1e1810', lineHeight: 1.3, flex: 1 }}>{r.title}</h3>
                        <span style={{ fontSize: 11, padding: '2px 8px', borderRadius: 20, marginLeft: 8, flexShrink: 0, background: diff[r.difficulty].bg, color: diff[r.difficulty].text }}>{r.difficulty}</span>
                      </div>
                      <p style={{ fontSize: 12, color: '#8a7a68', lineHeight: 1.65, marginBottom: 12 }}>{r.desc}</p>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
                          {r.tm.map(t => <TMTag key={t} label={t} />)}
                        </div>
                        <span style={{ fontSize: 12, color: '#a09080' }}>⏱ {r.time}m</span>
                      </div>
                    </div>
                  </article>
                ))}
              </div>
            )}
          </main>

          <footer style={{ background: 'white', borderTop: '1px solid #ede8e0', padding: '1.5rem 2rem', textAlign: 'center' }}>
            <p style={{ fontSize: 13, color: '#a09080' }}>麻薯菜谱 · mashuhome.com · 适用 Thermomix® 小美 · TM5 · TM6 · TM7</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
