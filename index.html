        steps:[{title:'爆香洋葱蒜',time:'5 分钟',desc:'橄榄油、切碎的洋葱和大蒜放入小美，100°C 速度 1 炒 5 分钟，炒到软化出香味。'},{title:'加入番茄',time:'15 分钟',desc:'番茄切块放入，100°C 速度 2，煮 15 分钟，煮到番茄完全软烂出汁，颜色变深。'},{title:'搅打顺滑',time:'30 秒',desc:'稍微放凉后，速度 8 搅打 30 秒，打成顺滑的番茄酱。喜欢有颗粒感的打短一点。'},{title:'收汁调味',time:'5 分钟',desc:'加入盐和糖，90°C 速度 2 再煮 5 分钟，煮到番茄酱变浓稠。尝一下味道，按喜好调整。'},{title:'装瓶保存',time:'',desc:'晾凉后装入玻璃瓶，冷藏保存约 2 周。做披萨、拌意面、涂面包都非常好用。'}]},

    ];

    const categories = ['全部','早餐','主食','汤羹','甜点','饮品','冷菜','酱料'];

    function TMTag({ label }) {
      const s = TM[label];
      return (
        <span style={{ fontSize:11, fontWeight:600, padding:'3px 9px', borderRadius:20, background:s.bg, color:s.text, border:`1px solid ${s.border}`, display:'inline-flex', alignItems:'center', gap:4 }}>
          <span style={{ width:6, height:6, borderRadius:'50%', background:s.dot, display:'inline-block' }} />{label}
        </span>
      );
    }

    function BackToTop() {
      const [show, setShow] = useState(false);
      useEffect(() => {
        const onScroll = () => setShow(window.scrollY > 300);
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <button className={`back-top${show ? ' show' : ''}`} onClick={() => window.scrollTo({ top:0, behavior:'smooth' })} title="回到顶部">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="18 15 12 9 6 15"/>
          </svg>
        </button>
      );
    }

    function ImgCard({ src, alt, className, style }) {
      const [loaded, setLoaded] = useState(false);
      return (
        <div className={`img-wrap${className ? ' '+className : ''}`} style={style}>
          <img src={src} alt={alt} className={loaded ? 'loaded' : ''} onLoad={() => setLoaded(true)} style={{ width:'100%', height:'100%', objectFit:'cover' }} />
        </div>
      );
    }

    function ShareButton({ recipe }) {
      const [tip, setTip] = useState('');

      const handleShare = () => {
        const url = window.location.href;
        const shareData = {
          title: recipe.title + ' · 麻薯食谱',
          text: recipe.desc + '\n\n来自麻薯食谱 mashuhome.com',
          url: url,
        };
        if (navigator.share) {
          navigator.share(shareData).catch(() => {});
        } else {
          navigator.clipboard.writeText(url).then(() => {
            setTip('链接已复制！打开微信粘贴给好友即可 🎉');
            setTimeout(() => setTip(''), 3000);
          }).catch(() => {
            setTip('请手动复制：' + url);
            setTimeout(() => setTip(''), 4000);
          });
        }
      };

      return (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', marginBottom:24, gap:8 }}>
          <button onClick={handleShare}
            style={{ display:'flex', alignItems:'center', gap:8, background:'#07c160', border:'none', borderRadius:24, padding:'10px 24px', color:'white', fontSize:14, fontWeight:600, cursor:'pointer', fontFamily:'inherit', boxShadow:'0 3px 12px rgba(7,193,96,0.3)' }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            分享给微信好友
          </button>
          {tip && (
            <div style={{ fontSize:12, color:'#4a8a3a', background:'#f0f8ec', padding:'6px 16px', borderRadius:20, border:'1px solid #c8e4b8' }}>
              {tip}
            </div>
          )}
        </div>
      );
    }

    function RecipeDetail({ r, onBack }) {

      // 动态插入 Recipe Schema，让搜索引擎识别每道菜
      useEffect(() => {
        const schema = {
          "@context": "https://schema.org",
          "@type": "Recipe",
          "name": r.title,
          "description": r.desc,
          "image": r.img,
          "author": { "@type": "Organization", "name": "麻薯食谱", "url": "https://www.mashuhome.com" },
          "datePublished": "2025-01-01",
          "recipeCategory": r.category,
          "recipeYield": r.servings + " 人份",
          "totalTime": "PT" + r.time + "M",
          "recipeIngredient": r.ingredients,
          "recipeInstructions": r.steps.map((step, i) => ({
            "@type": "HowToStep",
            "position": i + 1,
            "name": step.title,
            "text": step.desc
          })),
          "keywords": "小美食谱,美善品," + r.title + "," + r.category,
          "tool": r.tm.map(t => ({ "@type": "HowToTool", "name": "Thermomix " + t }))
        };
        const script = document.createElement('script');
        script.type = 'application/ld+json';
        script.id = 'recipe-schema';
        script.text = JSON.stringify(schema);
        document.head.appendChild(script);

        // 同步更新页面标题
        document.title = r.title + ' · 麻薯食谱';

        return () => {
          const el = document.getElementById('recipe-schema');
          if (el) el.remove();
          document.title = '麻薯食谱 · 小美家庭菜谱 | mashuhome.com';
        };
      }, [r]);

      return (
        <div style={{ background:'#fafaf8', minHeight:'100vh' }}>
          <div className="detail-nav">
            <div className="detail-nav-inner">
              <button onClick={onBack} style={{ background:'none', border:'none', color:'#5a7a50', fontSize:14 }}>← 返回食谱</button>
              <div style={{ display:'flex', alignItems:'center', gap:7 }}>
                <img src="https://i.postimg.cc/d3Ykkdm6/ma-shu-cai-pulogo2.png" alt="麻薯食谱" style={{ width:28, height:28, borderRadius:'50%', objectFit:'cover', objectPosition:'center 20%' }} />
                <span style={{ fontSize:13, color:'#3a5a30', fontWeight:700 }}>麻薯食谱</span>
              </div>
              <div style={{ width:60 }} />
            </div>
          </div>
          <div className="detail-hero">
            <ImgCard src={r.img} alt={r.title} style={{ width:'100%', height:'100%' }} />
          </div>
          <div className="detail-content">
            <div style={{ textAlign:'center', marginBottom:16 }}>
              <span style={{ fontSize:12, background:'#edf7e8', color:'#4a8a3a', borderRadius:20, padding:'3px 14px', display:'inline-block', marginBottom:10 }}>{r.category}</span>
              <h1 style={{ fontSize:26, fontWeight:700, color:'#1a1810', lineHeight:1.3, letterSpacing:'-0.3px' }}>{r.title}</h1>
            </div>
            <p style={{ fontSize:14, color:'#6a6055', lineHeight:1.8, marginBottom:20, textAlign:'center' }}>{r.desc}</p>
            <div style={{ display:'flex', justifyContent:'center', gap:20, marginBottom:16, flexWrap:'wrap' }}>
              <div style={{ textAlign:'center' }}><div style={{ fontSize:18 }}>⏱</div><div style={{ fontSize:13, color:'#7a7060', marginTop:2 }}>{r.time} 分钟</div></div>
              <div style={{ textAlign:'center' }}><div style={{ fontSize:18 }}>🍽</div><div style={{ fontSize:13, color:'#7a7060', marginTop:2 }}>{r.servings} 人份</div></div>
              <div style={{ textAlign:'center' }}>
                <div style={{ fontSize:18 }}>📊</div>
                <div style={{ marginTop:2 }}><span style={{ fontSize:12, background:diff[r.difficulty].bg, color:diff[r.difficulty].text, padding:'2px 10px', borderRadius:20 }}>{r.difficulty}</span></div>
              </div>
            </div>
            <div style={{ display:'flex', justifyContent:'center', gap:8, marginBottom:16, flexWrap:'wrap', alignItems:'center' }}>
              <span style={{ fontSize:12, color:'#a09880' }}>适用机型</span>
              {r.tm.map(t => <TMTag key={t} label={t} />)}
            </div>

            {/* 一键分享按钮 */}
            <ShareButton recipe={r} />
            <section style={{ background:'white', borderRadius:14, border:'1px solid #ede8e0', padding:'1.2rem', marginBottom:16 }}>
              <h2 style={{ fontSize:15, fontWeight:700, color:'#3a3028', marginBottom:14, display:'flex', alignItems:'center', gap:8 }}>
                <span style={{ width:4, height:18, background:'#6aaa60', borderRadius:2, display:'inline-block' }} />食材清单
              </h2>
              <div className="ingredient-grid">
                {r.ingredients.map((ing, i) => (
                  <div key={i} style={{ fontSize:13, color:'#5a5040', padding:'6px 0', borderBottom:'1px solid #f5f0e8', display:'flex', gap:8 }}>
                    <span style={{ color:'#9acc88', flexShrink:0 }}>·</span>{ing}
                  </div>
                ))}
              </div>
            </section>
            <section>
              <h2 style={{ fontSize:15, fontWeight:700, color:'#3a3028', marginBottom:14, display:'flex', alignItems:'center', gap:8 }}>
                <span style={{ width:4, height:18, background:'#6aaa60', borderRadius:2, display:'inline-block' }} />烹饪步骤
              </h2>
              {r.steps.map((step, i) => (
                <div key={i} style={{ display:'flex', gap:12, marginBottom:12 }}>
                  <div style={{ flexShrink:0, width:32, height:32, borderRadius:'50%', background:i===0?'#4a9a55':'#e8f0e4', color:i===0?'white':'#5a7a50', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:700, fontSize:14 }}>{i+1}</div>
                  <div style={{ background:'white', borderRadius:12, border:'1px solid #ede8e0', padding:'0.9rem 1rem', flex:1 }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6, flexWrap:'wrap', gap:4 }}>
                      <span style={{ fontWeight:600, color:'#2a2018', fontSize:14 }}>{step.title}</span>
                      {step.time && <span style={{ fontSize:11, background:'#f0f8ec', color:'#4a8a3a', padding:'2px 10px', borderRadius:20 }}>{step.time}</span>}
                    </div>
                    <p style={{ fontSize:13, color:'#7a6e60', lineHeight:1.75, margin:0 }}>{step.desc}</p>
                  </div>
                </div>
              ))}
            </section>
            <div style={{ marginTop:20, background:'#f5fbf0', border:'1px solid #d4eac8', borderRadius:10, padding:'1rem' }}>
              <p style={{ fontSize:13, color:'#4a7a3a', margin:0, lineHeight:1.7 }}>
                💡 <strong>小贴士：</strong>所有步骤均适用于小美（Thermomix Friend）。TM5 / TM6 / TM7 用户可根据各自机型说明书微调温度和时间设定。
              </p>
            </div>
          </div>
        </div>
      );
    }

    function QRModal({ src, alt, onClose }) {
      return (
        <div onClick={onClose} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.75)', zIndex:9999, display:'flex', alignItems:'center', justifyContent:'center', padding:'2rem' }}>
          <div onClick={e => e.stopPropagation()} style={{ background:'white', borderRadius:20, padding:'24px', textAlign:'center', maxWidth:320, width:'100%' }}>
            <img src={src} alt={alt} style={{ width:'100%', borderRadius:12 }} />
            <p style={{ fontSize:13, color:'#6a6a6a', marginTop:14, lineHeight:1.6 }}>微信扫一扫 或 长按保存到手机后在微信中识别</p>
            <button onClick={onClose} style={{ marginTop:14, padding:'8px 28px', borderRadius:24, border:'none', background:'#4a9a55', color:'white', fontSize:13, cursor:'pointer', fontFamily:'inherit' }}>关闭</button>
          </div>
        </div>
      );
    }

    function App() {
      const [search, setSearch] = useState('');
      const [category, setCategory] = useState('全部');
      const [selected, setSelected] = useState(null);
      const [page, setPage] = useState(1);
      const [qrModal, setQrModal] = useState(null);
      const PER_PAGE = 12;

      // 页面加载时读取 hash，直接打开对应食谱
      useEffect(() => {
        const hash = window.location.hash;
        if (hash.startsWith('#recipe-')) {
          const id = parseInt(hash.replace('#recipe-', ''));
          const recipe = recipes.find(r => r.id === id);
          if (recipe) { setSelected(recipe); window.scrollTo(0, 0); }
        }
      }, []);

      // 打开食谱，更新 URL hash
      const openRecipe = (r) => {
        setSelected(r);
        window.location.hash = 'recipe-' + r.id;
        window.scrollTo(0, 0);
      };

      // 返回列表，清除 hash
      const goBack = () => {
        setSelected(null);
        history.pushState('', document.title, window.location.pathname);
      };

      const filtered = useMemo(() => recipes.filter(r => {
        const matchCat = category === '全部' || r.category === category;
        const matchSearch = !search || r.title.includes(search) || r.desc.includes(search);
        return matchCat && matchSearch;
      }), [search, category]);

      const totalPages = Math.ceil(filtered.length / PER_PAGE);
      const paged = filtered.slice((page - 1) * PER_PAGE, page * PER_PAGE);
      const handleCategory = (c) => { setCategory(c); setPage(1); };
      const handleSearch = (v) => { setSearch(v); setPage(1); };

      if (selected) return <RecipeDetail r={selected} onBack={goBack} />;

      return (
        <div>
          <BackToTop />
          <header style={{ background:'linear-gradient(180deg, #f0f8f0 0%, #f7fbf5 100%)', borderBottom:'1px solid #d8edd8' }}>
            <div className="header-top">
              <div className="logo-area">
                <img className="logo-img" src="https://i.postimg.cc/d3Ykkdm6/ma-shu-cai-pulogo2.png" alt="麻薯食谱" />
                <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
                  <div className="brand-title">麻薯食谱</div>
                  <div className="brand-sub">
                    <span className="brand-sub-line" />
                    <span className="brand-sub-text">mashuhome</span>
                    <span className="brand-sub-line" />
                  </div>
                </div>
              </div>
              <div className="search-wrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b0a090" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input className="search-input" type="text" placeholder="搜索食谱…" value={search} onChange={e => handleSearch(e.target.value)} />
              </div>
            </div>
            <div className="hero">
              <img className="hero-img" src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200&h=400&fit=crop" alt="家庭餐桌" />
              <div className="hero-overlay" />
              <div className="hero-text">
                <h2>家常美味，轻松上桌</h2>
                <p>所有食谱适配小美，并标注 TM5 · TM6 · TM7 兼容性</p>
              </div>
            </div>

            <div style={{ background:'#e8f4e8', borderTop:'1px solid #d0e8d0' }}>
              <div className="category-bar">
              {categories.map(c => (
                <button key={c} className="cat-btn" onClick={() => handleCategory(c)}
                  style={{ background:category===c?'#4a9a55':'rgba(255,255,255,0.7)', color:category===c?'white':'#4a6a44', border:category===c?'none':'1px solid #b8d8b8' }}>
                  {c}
                </button>
              ))}
            </div>
            </div>
          </header>
          <main className="main-wrap">
            <p style={{ fontSize:12, color:'#b0a090', marginBottom:16 }}>{filtered.length} 道食谱 · 第 {page} / {totalPages} 页</p>
            {filtered.length === 0 ? (
              <div style={{ textAlign:'center', padding:'5rem 0', color:'#b0a090' }}>
                <p style={{ fontSize:15 }}>暂无相关食谱，换个关键词试试吧～</p>
              </div>
            ) : (
              <>
                <div className="recipe-grid">
                  {paged.map(r => (
                    <article key={r.id} className="card" onClick={() => openRecipe(r)}
                      style={{ background:'white', borderRadius:14, border:'1px solid #ede8e0', overflow:'hidden' }}>
                      <ImgCard src={r.img} alt={r.title} style={{ height:190 }} />
                      <div className="card-body">
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:6 }}>
                          <span className="card-title">{r.title}</span>
                          <span style={{ fontSize:11, padding:'2px 8px', borderRadius:20, marginLeft:8, flexShrink:0, background:diff[r.difficulty].bg, color:diff[r.difficulty].text }}>{r.difficulty}</span>
                        </div>
                        <p className="card-desc">{r.desc}</p>
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                          <div style={{ display:'flex', gap:5, flexWrap:'wrap' }}>
                            {r.tm.map(t => <TMTag key={t} label={t} />)}
                          </div>
                          <span style={{ fontSize:12, color:'#a09080' }}>⏱ {r.time}m</span>
                        </div>
                      </div>
                    </article>
                  ))}
                </div>

                {/* 分页控件 */}
                {totalPages > 1 && (
                  <div style={{ display:'flex', justifyContent:'center', alignItems:'center', gap:8, marginTop:40 }}>
                    <button onClick={() => setPage(p => Math.max(1, p-1))} disabled={page === 1}
                      style={{ padding:'8px 16px', borderRadius:24, border:'1px solid #ddd4c4', background:page===1?'#f5f0e8':'white', color:page===1?'#c0b8a8':'#4a9a55', cursor:page===1?'not-allowed':'pointer', fontSize:13, fontFamily:'inherit' }}>
                      ← 上一页
                    </button>
                    {Array.from({ length: totalPages }, (_, i) => i + 1).map(n => (
                      <button key={n} onClick={() => setPage(n)}
                        style={{ width:36, height:36, borderRadius:'50%', border:'none', background:page===n?'#4a9a55':'transparent', color:page===n?'white':'#6a5a48', cursor:'pointer', fontSize:13, fontFamily:'inherit', fontWeight:page===n?700:400 }}>
                        {n}
                      </button>
                    ))}
                    <button onClick={() => setPage(p => Math.min(totalPages, p+1))} disabled={page === totalPages}
                      style={{ padding:'8px 16px', borderRadius:24, border:'1px solid #ddd4c4', background:page===totalPages?'#f5f0e8':'white', color:page===totalPages?'#c0b8a8':'#4a9a55', cursor:page===totalPages?'not-allowed':'pointer', fontSize:13, fontFamily:'inherit' }}>
                      下一页 →
                    </button>
                  </div>
                )}
              </>
            )}
          </main>
          {/* 底部：小店橱窗 + 顾问联系 */}
          <div style={{ background:'#f5fbf5', borderTop:'1px solid #daeeda' }}>
            <div style={{ maxWidth:1060, margin:'0 auto', padding:'1.5rem 1.2rem 1.2rem' }}>
              <p style={{ textAlign:'center', fontSize:11, color:'#8a9a88', letterSpacing:1.5, textTransform:'uppercase', marginBottom:16 }}>联系我们</p>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>

                {/* 微信小店 */}
                <div style={{ background:'white', borderRadius:14, padding:'14px 12px', textAlign:'center', border:'1px solid #d8edd8' }}>
                  <div style={{ fontSize:12, fontWeight:700, color:'#1a1810', marginBottom:2 }}>🛒 美善品小店</div>
                  <div style={{ fontSize:10, color:'#8a9a88', marginBottom:10 }}>小美主机 · 配件 · 好物</div>
                  <div style={{ cursor:'pointer' }} onClick={() => setQrModal({ src:'https://i.postimg.cc/85nRsDpT/wei-xin-dian-pu-chu-chuang.png', alt:'微信小店二维码' })}>
                    <img src="https://i.postimg.cc/85nRsDpT/wei-xin-dian-pu-chu-chuang.png" alt="微信小店二维码"
                      style={{ width:'100%', maxWidth:120, borderRadius:10, border:'1.5px solid #c8e8c0', display:'block', margin:'0 auto' }} />
                    <div style={{ fontSize:10, color:'#07c160', marginTop:8, fontWeight:600 }}>点击放大 · 扫码进店</div>
                  </div>
                </div>

                {/* 顾问微信 */}
                <div style={{ background:'white', borderRadius:14, padding:'14px 12px', textAlign:'center', border:'1px solid #d8edd8' }}>
                  <div style={{ fontSize:12, fontWeight:700, color:'#1a1810', marginBottom:2 }}>👩‍💼 曾丽顾问</div>
                  <div style={{ fontSize:10, color:'#8a9a88', marginBottom:10 }}>海口福维克剑桥郡</div>
                  <div style={{ cursor:'pointer' }} onClick={() => setQrModal({ src:'https://i.postimg.cc/VNkrQnzK/ceng-li-wei-xin-er-wei-ma.png', alt:'曾丽微信二维码' })}>
                    <img src="https://i.postimg.cc/VNkrQnzK/ceng-li-wei-xin-er-wei-ma.png" alt="曾丽微信二维码"
                      style={{ width:'100%', maxWidth:120, borderRadius:10, border:'1.5px solid #c8e8c0', display:'block', margin:'0 auto' }} />
                    <div style={{ fontSize:10, color:'#07c160', marginTop:8, fontWeight:600 }}>点击放大 · 扫码咨询</div>
                  </div>
                </div>

              </div>
            </div>

            {/* 版权 */}
            <div style={{ borderTop:'1px solid #daeeda', padding:'0.8rem 1.5rem', textAlign:'center' }}>
              <p style={{ fontSize:10, color:'#a0b0a0' }}>麻薯食谱 · mashuhome.com · 适用 Thermomix® 小美 · TM5 · TM6 · TM7</p>
            </div>
          </div>

          {/* 放大二维码弹窗 */}
          {qrModal && <QRModal src={qrModal.src} alt={qrModal.alt} onClose={() => setQrModal(null)} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
