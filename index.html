    function App() {
      const [search, setSearch] = useState('');
      const [category, setCategory] = useState('全部');
      const [selected, setSelected] = useState(null);
      const filtered = useMemo(() => recipes.filter(r => {
        const matchCat = category === '全部' || r.category === category;
        const matchSearch = !search || r.title.includes(search) || r.desc.includes(search);
        return matchCat && matchSearch;
      }), [search, category]);

      if (selected) return <RecipeDetail r={selected} onBack={() => setSelected(null)} />;

      return (
        <div>
          <header style={{ background:'white', borderBottom:'1px solid #eee8de' }}>
            <div className="header-top">
              <div className="logo-area">
                <img className="logo-img" src="https://i.postimg.cc/d3Ykkdm6/ma-shu-cai-pulogo2.png" alt="麻薯食谱" />

              <div className="hero-overlay" />
              <div className="hero-text">
                <h2>家常美味，轻松上桌</h2>
                <p>所有食谱适配小美，并标注 TM5 · TM6 · TM7 兼容性</p>
              </div>
            </div>
