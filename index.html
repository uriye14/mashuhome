// ── Recipe Data ─────────────────────────────────────────────────
const recipes = [
  {id:2,title:'香蕉燕麦早餐粥',category:'早餐',time:12,servings:2,difficulty:'简单',img:'https://images.unsplash.com/photo-1657373373438-db858cf59399?q=80&w=1287&auto=format&fit=crop',desc:'熟透的香蕉自带天然甜味，营养满分，孩子们最爱的早晨第一餐',tm:['TM5','TM6','TM7'],ingredients:['即食燕麦片 120g','熟香蕉 2 根','牛奶 400ml','蜂蜜 1 汤匙','肉桂粉 少许','核桃碎 适量'],steps:[{title:'放入材料',time:'',desc:'将燕麦片、牛奶倒入锅中，香蕉剥皮直接放入，不需要提前切。'},{title:'烹煮',time:'8 分钟',desc:'90°C 速度 2，煮 8 分钟，香蕉会自动软化融入燕麦中。'},{title:'搅拌调味',time:'30 秒',desc:'加入蜂蜜，速度 4 搅拌 30 秒，根据喜好决定是否打得更细腻。'},{title:'装碗',time:'',desc:'盛入碗中，撒上核桃碎和少许肉桂粉，立即享用。'}]},
  {id:5,title:'南瓜糙米粥',category:'早餐',time:35,servings:4,difficulty:'简单',img:'https://images.unsplash.com/photo-1687684981416-6ff84d754b0b?q=80&w=927&auto=format&fit=crop',desc:'甜糯南瓜搭配糙米，健康低卡，老人和孩子都适合的养胃粥品',tm:['TM5','TM6','TM7'],ingredients:['南瓜 300g，去皮切块','糙米 150g，提前泡发 2 小时','水 1200ml','冰糖 2–3 颗','枸杞 少许'],steps:[{title:'准备材料',time:'',desc:'糙米提前泡发 2 小时，南瓜去皮切 2cm 小块。'},{title:'放入所有材料',time:'',desc:'将泡发好的糙米、南瓜块、水和冰糖一起放入锅中。'},{title:'慢煮',time:'30 分钟',desc:'100°C 速度 1，煮 30 分钟。中途南瓜会自然软化融入米粥。'},{title:'装碗',time:'',desc:'盛入碗中，点缀几粒枸杞，温热享用。'}]},
  {id:14,title:'五谷米糊',category:'早餐',time:40,servings:3,difficulty:'简单',img:'https://images.unsplash.com/photo-1555078604-b2379f0e964a?q=80&w=1364&auto=format&fit=crop',desc:'杂粮混在一起打成糊，暖胃又营养，冬天早上来一碗，一整天都有劲',tm:['TM5','TM6','TM7'],ingredients:['大米 50g','黑米 30g','小米 30g','燕麦片 20g','花生 20g','清水 800ml','冰糖 适量'],steps:[{title:'提前准备',time:'',desc:'所有食材淘洗干净。有时间的话提前泡发 2 小时。'},{title:'放入所有材料',time:'',desc:'把泡好的五谷杂粮和清水一起倒进小美。'},{title:'慢煮',time:'20 分钟',desc:'100°C 速度 1，煮 20 分钟，煮到食材都软烂为止。'},{title:'搅打成糊',time:'1 分钟',desc:'从速度 5 慢慢升到速度 10，搅打 1 分钟。'},{title:'加糖享用',time:'',desc:'加入冰糖，速度 3 搅匀融化，趁热喝。'}]},
  {id:3,title:'番茄鸡蛋意面',category:'主食',time:30,servings:3,difficulty:'简单',img:'https://images.unsplash.com/photo-1626844131082-256783844137?q=80&w=1335&auto=format&fit=crop',desc:'家常版番茄意面，酸甜开胃，简单食材做出让全家满足的一餐',tm:['TM5','TM6','TM7'],ingredients:['意大利面 250g','新鲜番茄 4 个','鸡蛋 3 个','大蒜 3 瓣','橄榄油 2 汤匙','番茄膏 1 汤匙','盐、糖 适量','罗勒叶 少许'],steps:[{title:'煮意面',time:'10 分钟',desc:'锅中烧开足量水，加盐，按包装说明煮意面，捞出备用。'},{title:'蒜香爆锅',time:'3 分钟',desc:'大蒜放入，速度 5 切碎。加橄榄油，100°C 速度 1 爆香 3 分钟。'},{title:'煮番茄酱',time:'12 分钟',desc:'番茄切块放入，加番茄膏、盐和少许糖，100°C 速度 2 煮 12 分钟至浓稠。'},{title:'加入鸡蛋',time:'3 分钟',desc:'鸡蛋打散后慢慢倒入，80°C 速度 2 轻轻搅拌 3 分钟，蛋液半凝固即可。'},{title:'拌入意面',time:'',desc:'将煮好的意面倒入拌匀，撒上新鲜罗勒叶，趁热上桌。'}]},
  {id:15,title:'番茄牛肉面',category:'主食',time:60,servings:3,difficulty:'中等',img:'https://images.unsplash.com/photo-1613744013720-4f505ce31735?q=80&w=1287&auto=format&fit=crop',desc:'汤头浓郁，牛肉软烂，番茄酸甜，这碗面端上桌全家都安静了',tm:['TM5','TM6','TM7'],ingredients:['牛腩 400g，切大块','番茄 3 个，切块','大蒜 3 瓣','姜 2 片','生抽 2 汤匙','老抽 1 茶匙','番茄膏 1 汤匙','盐、糖 适量','面条 适量','清水 800ml'],steps:[{title:'牛肉焯水',time:'',desc:'牛腩冷水下锅，普通锅大火煮开后捞出，冲洗干净去掉血水。'},{title:'爆香蒜姜',time:'3 分钟',desc:'大蒜和姜片放入小美，速度 5 切碎，加少许油，100°C 速度 1 炒 3 分钟。'},{title:'炒番茄',time:'5 分钟',desc:'番茄块和番茄膏一起放入，100°C 速度 1 翻炒 5 分钟，炒到番茄出汁变软。'},{title:'炖牛肉',time:'40 分钟',desc:'放入牛腩、生抽、老抽、盐、糖和清水，100°C 速度小勺反转，炖 40 分钟。'},{title:'煮面装碗',time:'',desc:'另起锅煮面，煮好捞出装碗，浇上满满一大勺番茄牛肉汤，趁热吃！'}]},
  {id:21,title:'橙香鸡翅',category:'热菜',time:45,servings:3,difficulty:'简单',img:'https://images.unsplash.com/photo-1527477396000-e27163b481c2?w=600&h=380&fit=crop',desc:'小美帮你把鸡翅煮入味，再送进烤箱烤出焦香，橙子的清香让整道菜清爽不腻',tm:['TM5','TM6','TM7'],ingredients:['翅中 500g','糖 10g','生抽 15g','老抽 20g','料酒 50g','水 100g','姜 20g，切片','橙子 1 个，切片'],steps:[{title:'放入腌料',time:'26 分钟',desc:'将翅中、糖、生抽、老抽、料酒、水和姜片全部放入小美，Varoma 温度速度 1，煮 26 分钟把鸡翅煮熟入味。'},{title:'取出备用',time:'',desc:'煮好后用刮刀棒轻轻翻拌均匀，让每块鸡翅都裹上酱汁，倒入碗中稍微放凉备用。'},{title:'烤箱烤制',time:'15 分钟',desc:'烤箱预热 200°C。鸡翅平铺在烤盘上，上面铺几片橙子，放入烤箱烤 15 分钟，表皮焦香上色就好了。'},{title:'装盘上桌',time:'',desc:'取出装盘，趁热吃，外皮焦脆，肉质软嫩，橙香四溢。'}]},
  {id:22,title:'牛肉丸',category:'主食',time:40,servings:4,difficulty:'中等',img:'images/recipes/niu-rou-wan.jpeg',desc:'弹牙爽口的手工牛肉丸，小美帮你搞定最难的打肉步骤，孩子们超爱吃',tm:['TM5','TM6','TM7'],ingredients:['牛肉 300g，切小块','蛋清 2 个','盐 9g','葱姜水 45g','生粉 15g','黑胡椒粉 适量'],steps:[{title:'处理牛肉',time:'',desc:'牛肉切成麻将大小的块，洗干净后放冰箱冷冻至稍微变硬。'},{title:'打肉',time:'40 秒',desc:'冻硬的牛肉放入小美，速度 6 打 20 秒，用刮刀把肉刮到底部，再速度 6 打 20 秒。'},{title:'调味上劲',time:'3 分钟',desc:'加入盐、蛋清、葱姜水、生粉和黑胡椒粉，速度 3 搅打 3 分钟上劲。'},{title:'煮丸子',time:'15 分钟',desc:'小美加水约 1900g，80°C 速度小勺预热。手蘸凉水挤出丸子，开 100°C 煮至丸子浮起来就熟了。'}]},
  {id:23,title:'鱼丸',category:'主食',time:35,servings:4,difficulty:'中等',img:'https://images.unsplash.com/photo-1763994682737-477d8200dd5d?q=80&w=2670&auto=format&fit=crop',desc:'嫩滑Q弹的自制鱼丸，没有任何添加剂，新鲜到可以直接咬着吃',tm:['TM5','TM6','TM7'],ingredients:['鱼肉 400g（草鱼或鲈鱼去皮去刺）','葱姜水 100g（分次加）','蛋清 3 个','料酒 40g','生粉 20g','白胡椒粉 5g','盐 15g'],steps:[{title:'第一次打肉',time:'',desc:'鱼肉放入小美，加 50g 葱姜水，速度 8 打 15 秒。重复这个步骤共 4 次，每次都加 50g 葱姜水。'},{title:'加入调味料',time:'30 秒',desc:'加入蛋清、料酒、生粉、剩余葱姜水和白胡椒粉，速度 8 再打 30 秒。'},{title:'加盐上筋',time:'2 分钟',desc:'加入盐，反转速度 3，搅打 2 分钟上筋。放进冷水能浮起来就说明上筋成功了！'},{title:'煮鱼丸',time:'5 分钟',desc:'烧一锅热水，加少许盐。水沸后转小火，手蘸凉水挤出鱼丸放入锅中，3-5 分钟丸子变大浮起就熟了。'}]},
  {id:27,title:'水煮牛肉',category:'热菜',time:45,servings:3,difficulty:'中等',img:'images/recipes/shui-zhu-niu-rou.png',desc:'麻辣鲜香的川菜经典，小美轻松搞定嫩滑牛肉和浓香辣底，上桌一片寂静',tm:['TM5','TM6','TM7'],ingredients:['鲜牛肉 300g，逆纹切薄片','淀粉 10g','清水 500ml','干花椒 2g','干辣椒 10g，切末','郫县豆瓣 50g，剁碎','豆芽 100g（或黄瓜、嫩菜适量）','葱蒜 30g','小葱 20g，切葱花','生抽 1 汤匙','老抽 少许','糖 少许','盐 适量','食用油 适量'],steps:[{title:'打淀粉水',time:'10 秒',desc:'淀粉加 500ml 清水放入小美，速度 10 搅打 10 秒，倒出过滤备用，这是嫩肉的关键。'},{title:'腌制牛肉',time:'20 分钟',desc:'牛肉逆纹切薄片，加淀粉水、生抽、老抽、少许糖腌制 20 分钟，用手将每片肉均匀裹上薄薄淀粉。'},{title:'爆香底料',time:'5 分钟',desc:'葱蒜放入小美速度 5 切碎，加油和郫县豆瓣，100°C 速度 1 翻炒 5 分钟，炒出红油和香气。'},{title:'煮配菜',time:'3 分钟',desc:'加入适量清水煮沸，放入豆芽等配菜，100°C 速度小勺煮 3 分钟，捞出铺在大碗底部。'},{title:'烫牛肉片',time:'2 分钟',desc:'汤底保持 100°C，牛肉片逐片滑入，速度小勺反转轻轻搅动，变色即刻捞出铺在蔬菜上，浇上汤底。'},{title:'浇热油激香',time:'',desc:'表面撒上干辣椒末、花椒和葱花，烧一勺滚烫热油直接淋上去，滋啦一声香气四溢，立即上桌。'}]},
  {id:26,title:'红烧肉',category:'热菜',time:60,servings:4,difficulty:'中等',img:'images/recipes/hong-shao-rou.jpeg',desc:'软糯入味的经典家常红烧肉，冰糖炒出琥珀糖色，小美慢炖让每一块都入口即化',tm:['TM5','TM6','TM7'],ingredients:['五花肉 600g，切 4cm 方块','冰糖 30g','生抽 3 汤匙','老抽 1 汤匙','料酒 3 汤匙','姜 4 片','大葱 1 段','八角 2 颗','清水 400ml'],steps:[{title:'五花肉焯水',time:'',desc:'五花肉冷水下锅，大火煮开后撇净浮沫，捞出冲洗干净备用。'},{title:'炒糖色',time:'5 分钟',desc:'小美加少许油和冰糖，100°C 速度 1，炒 5 分钟，看到糖化成深琥珀色。'},{title:'翻炒上色',time:'3 分钟',desc:'放入五花肉，100°C 速度小勺反转，翻炒 3 分钟，让每块肉都均匀裹上糖色。'},{title:'加入调料慢炖',time:'45 分钟',desc:'倒入生抽、老抽、料酒、姜片、葱段、八角和清水，100°C 速度小勺反转，慢炖 45 分钟至肉质软糯。'},{title:'收汁装盘',time:'7 分钟',desc:'取出葱姜和八角，120°C 速度小勺反转，收汁 7 分钟至汤汁浓稠包裹肉块，装盘撒葱花上桌。'}]},
  {id:1,title:'奶油蘑菇浓汤',category:'汤羹',time:25,servings:4,difficulty:'简单',img:'https://images.unsplash.com/photo-1552309463-7c221c5130c2?q=80&w=1287&auto=format&fit=crop',desc:'鲜嫩蘑菇搭配淡奶油，口感丝滑浓郁，是全家人都喜欢的暖身汤',tm:['TM5','TM6','TM7'],ingredients:['新鲜蘑菇 400g','洋葱 1 个，切碎','大蒜 2 瓣','淡奶油 150ml','牛奶 200ml','无盐黄油 20g','盐、白胡椒粉 适量','欧芹碎 少许'],steps:[{title:'炒香洋葱',time:'5 分钟',desc:'将黄油、大蒜和洋葱放入锅中，100°C 速度 1，炒 5 分钟至洋葱软化透明。'},{title:'加入蘑菇',time:'8 分钟',desc:'加入蘑菇，100°C 速度 1，翻炒 8 分钟直到蘑菇出水并变软。'},{title:'打成泥',time:'1 分钟',desc:'稍凉后，从速度 5 慢慢升至速度 9，搅打 1 分钟成光滑蘑菇泥。'},{title:'加入奶油',time:'5 分钟',desc:'倒入淡奶油和牛奶，90°C 速度 3，加热 5 分钟，用盐和白胡椒调味。'},{title:'盛盘享用',time:'',desc:'倒入碗中，撒上欧芹碎，趁热享用。可搭配脆皮面包一起吃。'}]},
  {id:16,title:'玉米排骨汤',category:'汤羹',time:65,servings:4,difficulty:'简单',img:'https://images.unsplash.com/photo-1717815963472-d1ae37cdd8d2?q=80&w=1364&auto=format&fit=crop',desc:'甜玉米配排骨，汤色奶白，喝起来鲜甜清润，家里老人小孩都爱喝',tm:['TM5','TM6','TM7'],ingredients:['猪排骨 500g','甜玉米 2 根，切段','胡萝卜 1 根，切滚刀块','姜 3 片','清水 1200ml','盐 适量','枸杞 少许（可选）'],steps:[{title:'排骨焯水',time:'',desc:'排骨冷水下锅，普通锅煮开后捞出，冲洗干净。焯水这步不能省，汤才会清甜不腥。'},{title:'放入所有材料',time:'',desc:'排骨、玉米段、胡萝卜、姜片和清水全部放进小美。'},{title:'慢炖',time:'50 分钟',desc:'100°C 速度小勺反转，炖 50 分钟。炖的时候汤色会慢慢变成奶白色。'},{title:'调味盛碗',time:'',desc:'加盐调味，撒几粒枸杞。盛出来趁热喝，玉米甜糯。'}]},
  {id:24,title:'金针肥牛',category:'热菜',time:25,servings:3,difficulty:'中等',img:'https://i.postimg.cc/L4WzkHzF/jin-zhen-gu-fei-niu.png',desc:'金黄浓郁的汤底配上嫩滑肥牛和爽脆金针菇，酸辣开胃，一上桌就被抢光',tm:['TM5','TM6','TM7'],ingredients:['肥牛卷 350g','金针菇 120g，去根','鸡高汤 900g','绿泡椒 20g','黄灯笼辣椒酱 20g','白醋 100g','油 15g','葱 2 支，切段','姜 5 片','蒜 3 瓣，切片','盐 3g','糖 5g','葱花、小米辣 适量'],steps:[{title:'肥牛焯水',time:'',desc:'肥牛卷放入开水中快速焯一下，变色就捞出，沥干备用。'},{title:'爆香底料',time:'3 分钟',desc:'油、葱、姜、蒜、绿泡椒和黄灯笼辣椒酱一起放入小美，120°C 速度 1 爆香 3 分钟。'},{title:'煮汤底',time:'8 分钟',desc:'倒入鸡高汤、白醋、盐和糖，100°C 速度小勺煮 8 分钟。'},{title:'加金针菇',time:'3 分钟',desc:'金针菇放入，100°C 速度小勺再煮 3 分钟，煮到金针菇变软入味。'},{title:'加入肥牛',time:'3 分钟',desc:'放入焯好的肥牛卷，Varoma 反转速度 1 烹煮 3 分钟。倒入大碗，撒上葱花和小米辣圈装饰！'}]},
  {id:11,title:'腌萝卜',category:'冷菜',time:30,servings:4,difficulty:'简单',img:'https://i.postimg.cc/C1ZZs9CN/yan-zhi-luo-bo-pian.jpg',desc:'酸甜爽脆的腌萝卜，用小美快速完成腌制，冷藏保存随取随吃，开胃下饭一绝',tm:['TM5','TM6','TM7'],ingredients:['白萝卜 1000g','生抽 130g','醋 100g','冰糖 100g'],steps:[{title:'准备腌汁',time:'6 分钟',desc:'锅内放入醋、生抽、冰糖，100°C 速度小勺煮开，约 6 分钟，让冰糖完全融化。'},{title:'处理萝卜',time:'18 分钟',desc:'白萝卜洗净，切成薄片，放入主锅。70°C 速度小勺反转，慢慢翻动 18 分钟让萝卜吸收腌汁。'},{title:'冷却装瓶',time:'',desc:'完成后取出，冷却至室温后放入玻璃瓶，放冰箱冷藏保存。'},{title:'小贴士',time:'',desc:'冷藏后口感更爽脆，隔夜后味道更佳。'}]},
  {id:25,title:'麻辣鸭舌',category:'冷菜',time:35,servings:2,difficulty:'简单',img:'images/recipes/ma-la-ya-she.jpg',desc:'麻辣鲜香，嚼劲十足，小美卤好之后拌上调味汁，下酒下饭都绝了',tm:['TM5','TM6','TM7'],ingredients:['鸭舌 250g，提前焯烫沥干','水 800g','生抽 2 茶匙','老抽 1 茶匙','十三香炖肉料包 1 包','盐 1/4 茶匙','糖 1/4 茶匙','花椒粉 2 茶匙','辣椒油 4 茶匙','麻油 2 茶匙','白芝麻 2 汤匙'],steps:[{title:'鸭舌焯水',time:'',desc:'鸭舌提前用开水焯烫，去掉腥味和杂质，捞出沥干备用。'},{title:'卤制鸭舌',time:'20 分钟',desc:'将焯好的鸭舌、水、生抽、老抽和十三香炖肉料包放入小美，100°C 速度 1 卤煮 20 分钟。'},{title:'取出沥干',time:'',desc:'卤好后把鸭舌取出，沥干水分，稍微放凉一会儿。'},{title:'调味拌匀',time:'',desc:'把盐、糖、花椒粉、辣椒油和麻油混合成调味汁。把鸭舌和调味汁充分拌匀，撒上白芝麻即可享用。'}]},
  {id:4,title:'苹果肉桂麦芬',category:'甜点',time:45,servings:12,difficulty:'中等',img:'https://images.unsplash.com/photo-1608847568631-50d50ebe4407?q=80&w=1286&auto=format&fit=crop',desc:'家里孩子最爱的下午茶点心，苹果粒软糯，肉桂香气四溢',tm:['TM5','TM6','TM7'],ingredients:['低筋面粉 200g','苹果 2 个，去皮切丁','鸡蛋 2 个','牛奶 120ml','无盐黄油 80g','细砂糖 90g','泡打粉 1.5 茶匙','肉桂粉 1 茶匙'],steps:[{title:'预热烤箱',time:'',desc:'烤箱预热至 180°C，麦芬模具铺上纸杯备用。'},{title:'融化黄油',time:'2 分钟',desc:'黄油放入，50°C 速度 2 融化约 2 分钟。加入糖、鸡蛋、牛奶，速度 4 搅拌均匀。'},{title:'加粉类',time:'10 秒',desc:'筛入面粉、泡打粉、肉桂粉，速度 4 搅拌约 10 秒，看不到干粉即可。'},{title:'拌入苹果',time:'',desc:'用刮刀轻轻折叠拌入苹果丁，动作要轻柔保持面糊蓬松。'},{title:'烘烤',time:'22 分钟',desc:'面糊倒入模具至七分满，180°C 烤约 22 分钟，牙签插入无沾即熟。'}]},
  {id:17,title:'双皮奶',category:'甜点',time:45,servings:4,difficulty:'中等',img:'https://images.unsplash.com/photo-1488477181946-6428a0291777?w=600&h=380&fit=crop',desc:'比奶茶店还好吃的双皮奶，嫩滑到勺子插进去都是享受，冷藏后口感更绝',tm:['TM5','TM6','TM7'],ingredients:['全脂牛奶 500ml','蛋清 3 个','白糖 40g'],steps:[{title:'加热牛奶',time:'5 分钟',desc:'牛奶倒入小美，80°C 速度 2 加热 5 分钟，然后倒入碗中，静置放凉。表面会自然形成一层奶皮，这是第一层。'},{title:'打蛋清',time:'2 分钟',desc:'蛋清加白糖，用蝴蝶棒速度 4 打约 2 分钟，打到起泡就好，不需要打到全发。'},{title:'混合',time:'',desc:'轻轻用牙签挑开碗边的奶皮，把蛋清液从边缘缓缓倒入奶皮下方，然后把奶皮轻轻放回表面。'},{title:'上锅蒸',time:'25 分钟',desc:'蒸锅加水，放好碗后盖上保鲜膜，80°C 蒸 25 分钟。蒸的过程不要开盖！'},{title:'冷藏享用',time:'',desc:'蒸好后放凉，放冰箱冷藏 1 小时，口感更嫩滑。'}]},
  {id:12,title:'自制豆浆',category:'饮品',time:20,servings:4,difficulty:'简单',img:'https://images.unsplash.com/photo-1555465083-a845797ef750?q=80&w=1364&auto=format&fit=crop',desc:'比超市买的香太多了！自己打的豆浆没有任何添加剂，浓郁又健康，早餐喝一碗超满足',tm:['TM5','TM6','TM7'],ingredients:['干黄豆 100g（提前泡发一晚）','清水 1000ml','白糖 适量'],steps:[{title:'泡豆',time:'',desc:'黄豆提前用清水泡发一整夜，泡好后冲洗几遍。'},{title:'放入材料',time:'',desc:'把泡好的黄豆和 1000ml 清水一起倒进小美。'},{title:'搅打',time:'1 分钟',desc:'从速度 5 慢慢升到速度 10，搅打 1 分钟，打到顺滑细腻为止。'},{title:'过滤豆渣',time:'',desc:'用豆浆袋或细网筛过滤一遍。'},{title:'煮熟',time:'8 分钟',desc:'过滤好的豆浆倒回小美，100°C 速度 2，煮 8 分钟。一定要煮熟才能喝！加糖调味，趁热享用。'}]},
  {id:7,title:'百香果柠檬气泡饮',category:'饮品',time:5,servings:2,difficulty:'简单',img:'https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=600&h=380&fit=crop',desc:'清爽酸甜的夏日饮品，孩子放学回来的最佳奖励',tm:['TM5','TM6','TM7'],ingredients:['百香果 3 个，取果肉','新鲜柠檬 1 个，取汁','蜂蜜 2 汤匙','气泡水 400ml（冰的）','冰块 适量'],steps:[{title:'制作糖浆',time:'30 秒',desc:'百香果肉、柠檬汁和蜂蜜放入，速度 5 搅打 30 秒混合均匀。'},{title:'过滤（可选）',time:'',desc:'若不喜欢百香果籽，可用细筛过滤，取清澈果汁。'},{title:'组合饮品',time:'',desc:'杯中加满冰块，倒入果汁，再缓慢注入冰气泡水，不要搅拌保留气泡。'}]},
  {id:8,title:'香蕉可可奶昔',category:'饮品',time:5,servings:2,difficulty:'简单',img:'https://images.unsplash.com/photo-1542444592-e6880e286bb9?q=80&w=961&auto=format&fit=crop',desc:'天然甜味无需加糖，浓稠丝滑，孩子的健康早餐饮品',tm:['TM5','TM6','TM7'],ingredients:['熟香蕉 2 根（冷冻后更浓稠）','可可粉 2 汤匙','牛奶 250ml','蜂蜜 1 汤匙（可选）','冰块 少许'],steps:[{title:'放入材料',time:'',desc:'将香蕉（冷冻最佳）、可可粉、牛奶全部放入。'},{title:'搅打',time:'1 分钟',desc:'从速度 5 慢慢升至速度 10，搅打约 1 分钟至完全顺滑无颗粒。'},{title:'立即享用',time:'',desc:'倒入杯中立即饮用，现做现喝最佳。'}]},
  {id:6,title:'自制花生酱',category:'酱料',time:15,servings:1,difficulty:'简单',img:'https://images.unsplash.com/photo-1615110250484-e8c3b151b957?q=80&w=1287&auto=format&fit=crop',desc:'只需花生和少许盐，无任何添加剂，浓郁程度远超超市瓶装花生酱',tm:['TM5','TM6','TM7'],ingredients:['去皮熟花生 300g','盐 1/4 茶匙','蜂蜜 1 汤匙（可选）','葡萄籽油 少许'],steps:[{title:'准备花生',time:'',desc:'使用已去皮的熟花生，确保完全干燥，不能有水分。'},{title:'初步搅打',time:'1 分钟',desc:'花生放入，从速度 5 逐渐升至速度 10，搅打 1 分钟，变成粗粒状。'},{title:'持续研磨',time:'3 分钟',desc:'速度 10 继续搅打 3 分钟，花生会先变成粉，再逐渐出油变成糊状。中途用刮刀刮壁。'},{title:'调味装瓶',time:'',desc:'加入盐和蜂蜜，速度 5 混合 10 秒。装入干净玻璃瓶，密封冷藏可保存约 1 个月。'}]},
  {id:18,title:'葱油',category:'酱料',time:20,servings:1,difficulty:'简单',img:'images/recipes/cong-you.jpeg',desc:'一罐葱油，拌面拌饭拌什么都香，自己炸的比外面买的香十倍，做一罐能用好久',tm:['TM5','TM6','TM7'],ingredients:['小葱 200g，切成 5cm 小段','色拉油 300ml','盐 少许'],steps:[{title:'葱一定要晾干',time:'',desc:'小葱洗净后必须完全晾干，有水分放进热油会溅油。晾干至少半小时。'},{title:'放入小美',time:'',desc:'葱段和色拉油一起放入小美，葱要完全浸在油里。'},{title:'慢炸',time:'15 分钟',desc:'120°C 速度小勺反转，慢炸 15 分钟。葱会从翠绿慢慢变成金黄色。'},{title:'过滤装瓶',time:'',desc:'用细筛过滤掉葱渣，留下清澈金黄的葱油。晾凉后装入干净玻璃瓶，密封冷藏保存约一个月。'}]},
  {id:19,title:'辣椒酱',category:'酱料',time:25,servings:1,difficulty:'简单',img:'https://images.unsplash.com/photo-1692302756206-3dd7506cb8f0?q=80&w=1287&auto=format&fit=crop',desc:'不辣不欢的朋友必备！自己做的辣椒酱，想多辣就多辣，吃什么都能加一勺',tm:['TM5','TM6','TM7'],ingredients:['新鲜红辣椒 300g，去蒂','大蒜 50g','姜 20g','食用油 50ml','盐 1 茶匙','糖 1 茶匙','生抽 1 汤匙'],steps:[{title:'处理食材',time:'',desc:'辣椒去蒂洗净，一定要完全晾干。大蒜和姜不需要提前切，直接放进小美就行。'},{title:'切碎',time:'5 秒',desc:'辣椒、大蒜、姜一起放入，速度 5 搅打 5 秒，打成粗粒状。'},{title:'炒制',time:'10 分钟',desc:'加入食用油，100°C 速度 1 翻炒 10 分钟，把辣椒的水分炒干，香味全出来了。'},{title:'调味装瓶',time:'',desc:'加入盐、糖和生抽，继续 100°C 速度 1 炒 5 分钟，炒到稍微浓稠就好。放凉后装入玻璃瓶，冷藏保存。'}]},
  {id:30,title:'青椒酱',category:'酱料',time:15,servings:1,difficulty:'简单',img:'images/recipes/qing-jiao-jiang.jpeg',desc:'成都风味秘制青椒酱，香辣鲜咸，拌面蘸菜都绝，喜欢辣的把二荆条换成小米椒',tm:['TM5','TM6','TM7'],ingredients:['二荆条 50g','姜 10g','蒜 10g','生抽 20g','油 50g','豆豉 20g','甜面酱 5g','白糖 5g','盐 1/2 茶匙','花椒面 1/4 茶匙','鸡精 1/2 茶匙','醋 10g','芹菜末 20g'],steps:[{title:'打碎食材',time:'5 秒',desc:'二荆条、姜、蒜放入小美，速度 6 搅打 5 秒打碎。'},{title:'炒香',time:'3 分钟',desc:'加入油，Varoma 温度速度 0.5，翻炒 3 分钟。'},{title:'加调料炒匀',time:'5 分钟',desc:'加入豆豉、甜面酱、生抽、盐、白糖、花椒面和鸡精，Varoma 温度，前 1 分钟速度 1，后 4 分钟速度 0.5，共炒 5 分钟。'},{title:'收尾调味',time:'10 秒',desc:'加入醋和芹菜末，速度 2 混合 10 秒均匀即可。装瓶冷藏保存。'}]},
  {id:20,title:'番茄酱',category:'酱料',time:35,servings:1,difficulty:'简单',img:'https://images.unsplash.com/photo-1472476443507-c7a5948772fc?w=600&h=380&fit=crop',desc:'用新鲜番茄自己熬的番茄酱，酸甜浓郁，比瓶装的新鲜好吃，做披萨拌面都用得上',tm:['TM5','TM6','TM7'],ingredients:['成熟番茄 800g','洋葱 半个','大蒜 3 瓣','橄榄油 2 汤匙','盐 1 茶匙','糖 1 茶匙','罗勒叶 少许（可选）'],steps:[{title:'爆香洋葱蒜',time:'5 分钟',desc:'橄榄油、切碎的洋葱和大蒜放入小美，100°C 速度 1 炒 5 分钟，炒到软化出香味。'},{title:'加入番茄',time:'15 分钟',desc:'番茄切块放入，100°C 速度 2，煮 15 分钟，煮到番茄完全软烂出汁，颜色变深。'},{title:'搅打顺滑',time:'30 秒',desc:'稍微放凉后，速度 8 搅打 30 秒，打成顺滑的番茄酱。'},{title:'收汁调味',time:'5 分钟',desc:'加入盐和糖，90°C 速度 2 再煮 5 分钟，煮到番茄酱变浓稠。晾凉后装入玻璃瓶，冷藏保存约 2 周。'}]},

// ── Helpers ──────────────────────────────────────────────────────
function tmTagHTML(label) {
  const s = TM[label];
  return `<span class="tm-tag" style="background:${s.bg};color:${s.text};border:1px solid ${s.border}"><span class="tm-dot" style="background:${s.dot}"></span>${label}</span>`;
}
function diffBadge(d) {
  const s = DIFF[d];
  return `<span class="diff-badge" style="background:${s.bg};color:${s.text}">${d}</span>`;
}
function filtered() {
  return recipes.filter(r => {
    const mc = state.category === '全部' || r.category === state.category;
    const ms = !state.search || r.title.includes(state.search) || r.desc.includes(state.search);
    return mc && ms;
  });
}
function paged() {
  const f = filtered();
  return f.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);
}

function renderPagination() {
  const f = filtered();
  const total = Math.ceil(f.length / PER_PAGE);
  if (total <= 1) return '';
  const nums = Array.from({length: total}, (_, i) => i + 1)
    .map(n => `<button class="page-num${state.page===n?' active':''}" data-action="page" data-val="${n}">${n}</button>`).join('');
  return `
  <div class="pagination">
    <button class="page-btn" data-action="page" data-val="${state.page-1}" ${state.page===1?'disabled':''}>← 上一页</button>
    ${nums}
    <button class="page-btn" data-action="page" data-val="${state.page+1}" ${state.page===total?'disabled':''}>下一页 →</button>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  if (state.view === 'list') {
    app.innerHTML = renderListPage() + renderModal();
    // Restore search input
    const inp = document.getElementById('searchInput');
    if (inp) {
      inp.addEventListener('input', e => { state.search = e.target.value; state.page = 1; render(); });
      inp.focus && inp.value && inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  } else {
    app.innerHTML = renderDetailPage() + renderModal();
  }
}

// ── Events ───────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'open') {
    const id = parseInt(el.dataset.id);
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;
    addClick(id);
    state.selected = recipe;
    state.view = 'detail';
    window.location.hash = encodeURIComponent(recipe.title);
    window.scrollTo(0, 0);
    render();
    injectRecipeSchema(recipe);
  }

  if (action === 'back') {
    state.view = 'list';
    state.selected = null;
    history.pushState('', document.title, window.location.pathname);
    window.scrollTo(0, 0);
    render();
    removeRecipeSchema();
  }

  if (action === 'category') {
    state.category = el.dataset.val;
    state.page = 1;
    render();
  }

  if (action === 'page') {
    const v = parseInt(el.dataset.val);
    if (!isNaN(v) && v >= 1) { state.page = v; window.scrollTo(0,0); render(); }
  }

  if (action === 'qr') {
    state.qrModal = { src: el.dataset.src, alt: el.dataset.alt };
    render();
  }

  if (action === 'close-modal') {
    state.qrModal = null;
    render();
  }

  if (action === 'share-site') {
    state.siteShare = true;
    render();
  }

  if (action === 'close-site-share') {
    state.siteShare = false;
    render();
  }

  if (action === 'copy-site-link') {
    const tip = document.getElementById('copyLinkTip');
    navigator.clipboard.writeText('https://mashuhome.com').then(() => {
      if (tip) { tip.textContent = '✅ 已复制！打开微信粘贴给好友'; setTimeout(() => { if (tip) tip.textContent = ''; }, 3000); }
    }).catch(() => {
      if (tip) { tip.textContent = 'https://mashuhome.com'; }
    });
  }

  if (action === 'share') {
    const r = state.selected;
    const url = window.location.href;
    const tip = document.getElementById('shareTip');
    if (navigator.share) {
      navigator.share({ title: r.title + ' · 麻薯食谱', text: r.desc, url }).catch(()=>{});
    } else {
      navigator.clipboard.writeText(url).then(() => {
        if (tip) { tip.textContent = '链接已复制！打开微信粘贴给好友即可 🎉'; tip.style.display='block'; setTimeout(()=>tip.style.display='none', 3000); }
      }).catch(() => {
        if (tip) { tip.textContent = '请手动复制：' + url; tip.style.display='block'; setTimeout(()=>tip.style.display='none', 4000); }
      });
    }
  }
});

// ── Schema injection ─────────────────────────────────────────────
function injectRecipeSchema(r) {
  removeRecipeSchema();
  const s = document.createElement('script');
  s.type = 'application/ld+json'; s.id = 'recipe-schema';
  s.text = JSON.stringify({"@context":"https://schema.org","@type":"Recipe","name":r.title,"description":r.desc,"image":r.img,"author":{"@type":"Organization","name":"麻薯食谱"},"recipeCategory":r.category,"totalTime":"PT"+r.time+"M","recipeYield":r.servings+" 人份","recipeIngredient":r.ingredients,"recipeInstructions":r.steps.map((st,i)=>({"@type":"HowToStep","position":i+1,"name":st.title,"text":st.desc}))});
  document.head.appendChild(s);
  document.title = r.title + ' · 麻薯食谱';
}
function removeRecipeSchema() {
  const el = document.getElementById('recipe-schema');
  if (el) el.remove();
  document.title = '麻薯食谱 · 小美家庭菜谱 | mashuhome.com';
}

// ── Back to top ──────────────────────────────────────────────────
window.addEventListener('scroll', () => {
  const btn = document.getElementById('backTop');
  if (btn) btn.classList.toggle('show', window.scrollY > 300);
});

// ── Hash routing ─────────────────────────────────────────────────
function checkHash() {
  const hash = window.location.hash;
  if (!hash || hash === '#') return;
  let recipe;
  if (hash.startsWith('#recipe-')) {
    // 旧格式兼容：#recipe-22
    const id = parseInt(hash.replace('#recipe-', ''));
    recipe = recipes.find(r => r.id === id);
  } else {
    // 新格式：#菜谱名
    const title = decodeURIComponent(hash.slice(1));
    recipe = recipes.find(r => r.title === title);
  }
  if (recipe) { state.selected = recipe; state.view = 'detail'; injectRecipeSchema(recipe); }
}

// ── Init ─────────────────────────────────────────────────────────
checkHash();
render();
</script>
</body>
</html>
